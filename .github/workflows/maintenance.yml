name: maintenance-and-fallback

# GitHub Actions is the optional backup:
#  1. maintenance: free stuck jobs, retry file deletions, trim old rows (cheap, every 6 hours)
#  2. fallback: only if links have been waiting too long and no main worker (Modal) is running, process them here
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: clip-maintenance
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fallback: ${{ steps.check.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run maintenance
      - id: check
        run: npm run fallback:check

  fallback:
    needs: maintenance
    if: needs.maintenance.outputs.fallback == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL: ${{ secrets.HF_MODEL }}
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
      FFMPEG_PATH: /usr/bin/ffmpeg
      LOCAL_WHISPER: "off"   # the runner uses the hosted APIs (Groq / Hugging Face / Gemini), not a local model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: System packages and yt-dlp
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          sudo curl -fsSL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
      - run: npm install --no-audit --no-fund
      - run: npm run worker
